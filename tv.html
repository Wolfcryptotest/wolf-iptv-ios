<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Wolf IPTV TV</title>
<style>
html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0e12; }
body { width: 1280px; height: 720px; transform-origin: 0 0; }
html, body { margin: 0; padding: 0; overflow: hidden; background: #0d0e12; color: #eceef4;
  font-family: Arial, Helvetica, sans-serif; font-size: 24px; }
#top { position: absolute; left: 0; top: 0; right: 0; height: 64px; background: #16181f; }
#logo { position: absolute; left: 28px; top: 14px; font-size: 30px; font-weight: bold; }
#logo span { color: #e4002b; }
#logo i { color: #fdb912; font-style: normal; }
#acc { position: absolute; right: 130px; top: 23px; font-size: 17px; color: #9aa0b4; }
#clock { position: absolute; right: 28px; top: 16px; font-size: 28px; font-weight: bold; }
#tabs { position: absolute; left: 200px; top: 8px; width: 760px; height: 48px; }
.tab { position: absolute; top: 0; width: 170px; height: 48px; line-height: 48px; text-align: center; background: #1e2029;
  border-radius: 8px; color: #9aa0b4; font-weight: bold; }
.tab.on { background: #26324a; color: #fff; }
.col { position: absolute; top: 76px; height: 630px; overflow: hidden; background: #121319; border-radius: 10px; }
#cats { left: 20px; width: 300px; }
#items { left: 335px; width: 515px; }
.row { height: 42px; line-height: 42px; font-size: 21px; padding: 0 16px; white-space: nowrap; overflow: hidden; color: #eceef4; }
.row .n { display: inline-block; width: 52px; color: #9aa0b4; text-align: right; margin-right: 16px; }
.row .s { display: inline-block; width: 32px; color: #9aa0b4; }
.row .s.on { color: #facc15; }
.row.sel { background: #263453; }
.row.foc { background: #2f5bd3; color: #fff; }
.row, .tab { cursor: pointer; }
.row .s { cursor: pointer; }
#pBack { position: absolute; left: 30px; bottom: 30px; padding: 14px 30px; font-size: 28px; font-weight: bold; background: rgba(30,32,41,0.9);
  border: 2px solid #3b82f6; border-radius: 12px; color: #fff; display: none; cursor: pointer; z-index: 5; }
#pPlay { position: absolute; left: 230px; bottom: 30px; padding: 14px 30px; font-size: 28px; font-weight: bold; background: rgba(30,32,41,0.9);
  border: 2px solid #3b82f6; border-radius: 12px; color: #fff; display: none; cursor: pointer; z-index: 5; }
/* Geri / Oynat ekran düğmeleri kapalı: kumandanın Geri ve Oynat tuşları kullanılıyor */
.row.play { color: #7cc4ff; font-weight: bold; }
.row.head { color: #facc15; font-weight: bold; }
.row .cnt { float: right; color: #ef4444; font-weight: bold; margin-left: 10px; }
/* afiş ızgarası (filmler / diziler) */
#items.grid { background: transparent; overflow: visible; }
.tile { position: absolute; width: 122px; height: 183px; border-radius: 10px; overflow: hidden; background: #1e2029; cursor: pointer; }
.tile img { position: absolute; left: 0; top: 0; width: 122px; height: 183px; object-fit: cover; }
.tile .nm { position: absolute; left: 8px; right: 8px; top: 60px; font-size: 17px; color: #cfd3e0; text-align: center; white-space: normal; }
.tile .tt { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 5px 5px; font-size: 13px; line-height: 16px; color: #fff;
  background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.9)); white-space: normal; max-height: 40px; overflow: hidden; display: none; }
.tile.foc .tt, .tile.noimg .tt { display: block; }
.tile .s { position: absolute; right: 6px; top: 4px; font-size: 24px; color: #facc15; text-shadow: 0 0 4px #000; width: auto; }
.tile .pr { position: absolute; left: 0; bottom: 0; height: 5px; background: #ef4444; }
.tile.foc { box-shadow: 0 0 0 4px #3b82f6, 0 0 18px #3b82f6; }
.tile.play { box-shadow: 0 0 0 3px #4ade80; }
.tile.foc.play { box-shadow: 0 0 0 4px #3b82f6, 0 0 0 7px #4ade80; }
.dim .tile.foc { box-shadow: 0 0 0 3px #263453; }
.row.muted { color: #9aa0b4; }
#cats .row { height: 36px; line-height: 36px; font-size: 19px; }
.dim .row.foc { background: #263453; }
#help, #info { display: none !important; }
#help { position: absolute; left: 20px; right: 20px; top: 636px; height: 40px; line-height: 40px; font-size: 18px; color: #6b7184; }
#help b { color: #ef4444; }
#info { position: absolute; left: 20px; right: 20px; top: 676px; height: 40px; line-height: 40px; font-size: 19px; color: #9aa0b4;
  white-space: nowrap; overflow: hidden; }
#player { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #000; display: none; z-index: 8; }   /* tam ekran: detay sayfasının da önünde */
/* küçük pencere: canlı TV listesinin sağında */
#player.mini { left: 865px; top: 76px; width: 395px; height: 222px; border-radius: 10px; overflow: hidden; z-index: 3;
  box-shadow: 0 0 0 2px #263453; cursor: pointer; }
#player.mini #osd, #player.mini #msg { display: none !important; }
#pFull { position: absolute; right: 8px; bottom: 8px; width: 44px; height: 38px; line-height: 38px; text-align: center; font-size: 26px;
  background: rgba(0,0,0,0.6); color: #fff; border-radius: 8px; display: none; z-index: 4; }
#player.mini #pFull { display: block; }
#pv { position: absolute; left: 865px; top: 76px; width: 395px; height: 630px; background: #121319; border-radius: 10px; overflow: hidden; }
#pvPic { position: absolute; left: 0; top: 0; width: 395px; height: 222px; background-color: #0b0c10; background-position: center;
  background-repeat: no-repeat; background-size: contain; color: #6b7184; font-size: 22px; text-align: center; }
#pvPic div { padding-top: 84px; line-height: 30px; }
#pvTxt { position: absolute; left: 16px; right: 16px; top: 234px; bottom: 12px; font-size: 19px; line-height: 26px; color: #aeb3c2;
  overflow: hidden; white-space: pre-line; }
#pvTxt b { display: block; color: #fff; font-size: 24px; line-height: 30px; margin-bottom: 6px; white-space: normal; }
#pvTxt i { display: block; font-style: normal; color: #facc15; margin-bottom: 8px; }
#ytShield { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: none; z-index: 4; }
#ctl { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 40px 26px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.85));
  display: none; z-index: 5; }
#player.mini #ctl { display: none !important; }
#cTitle { font-size: 26px; font-weight: bold; margin-bottom: 12px; white-space: nowrap; overflow: hidden; }
#cBar { position: relative; height: 16px; background: rgba(255,255,255,0.25); border-radius: 8px; cursor: pointer; }
#cFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #e4002b; border-radius: 8px; }
#cBtns { margin-top: 16px; height: 50px; font-size: 26px; }
#cBtns span { display: inline-block; padding: 8px 24px; margin-right: 12px; background: rgba(30,32,41,0.9); border: 2px solid #3b82f6; border-radius: 10px; cursor: pointer; }
#cBtns #cTime { float: right; border: 0; background: none; color: #cfd3e0; margin: 0; }
/* film / dizi detay sayfası */
#det { position: absolute; left: 0; top: 64px; width: 1280px; height: 656px; background: #0d0e12; display: none; z-index: 6; }
#dPoster { position: absolute; left: 30px; top: 22px; width: 240px; height: 360px; border-radius: 10px; background-color: #1e2029;
  background-position: center; background-size: cover; background-repeat: no-repeat; }
#dBody { position: absolute; left: 300px; top: 18px; right: 30px; bottom: 16px; overflow: hidden; }
#dTitle { font-size: 32px; font-weight: bold; white-space: nowrap; overflow: hidden; }
#dMeta { font-size: 19px; color: #facc15; margin-top: 8px; }
#dCrew { font-size: 17px; color: #9aa0b4; margin-top: 8px; line-height: 24px; max-height: 48px; overflow: hidden; white-space: pre-line; }
#dPlot { font-size: 19px; line-height: 27px; color: #cfd3e0; margin-top: 10px; overflow: hidden; }
#dBtns { margin-top: 16px; height: 50px; }
.dbtn { display: inline-block; padding: 10px 26px; margin-right: 12px; font-size: 21px; font-weight: bold; background: #1e2029; border-radius: 10px; cursor: pointer; }
.dbtn.foc { background: #2f5bd3; color: #fff; box-shadow: 0 0 0 3px #3b82f6; }
#dSeas { margin-top: 10px; white-space: nowrap; overflow: hidden; height: 40px; }
.dse { display: inline-block; padding: 6px 16px; margin-right: 8px; font-size: 19px; background: #1e2029; border-radius: 8px; color: #9aa0b4; cursor: pointer; }
.dse.on { background: #26324a; color: #fff; }
.dse.foc { background: #2f5bd3; color: #fff; }
#dEps { margin-top: 6px; }
.dep { height: 36px; line-height: 36px; font-size: 19px; padding: 0 12px; white-space: nowrap; overflow: hidden; border-radius: 6px; cursor: pointer; }
.dep.foc { background: #2f5bd3; color: #fff; }
.dep .pr { color: #ef4444; margin-left: 10px; }
/* arama sekmesi: gömülü arama kutusu */
#sbar { position: absolute; left: 20px; top: 76px; width: 830px; height: 52px; display: none; }
#sbar span { position: absolute; left: 16px; top: 11px; font-size: 24px; }
#sq { width: 830px; height: 52px; font-size: 24px; padding: 0 18px 0 56px; background: #1e2029; color: #fff; border: 2px solid #2a2d3a;
  border-radius: 10px; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
#sq:focus { border-color: #3b82f6; outline: none; }
.del { float: right; color: #ef4444; padding: 0 8px; cursor: pointer; font-size: 22px; }
.tile .del { position: absolute; left: 4px; top: 4px; float: none; background: rgba(0,0,0,0.75); border-radius: 6px; padding: 2px 6px; font-size: 20px; z-index: 2; }
/* TV rehberi (kanal × saat tablosu) */
#epg { position: absolute; left: 0; top: 64px; width: 1280px; height: 656px; background: #0d0e12; display: none; z-index: 6; overflow: hidden; }
.eh span { position: absolute; top: 10px; font-size: 18px; color: #9aa0b4; }
.ec { position: absolute; left: 20px; width: 210px; height: 46px; line-height: 46px; font-size: 18px; white-space: nowrap; overflow: hidden;
  background: #16181f; border-radius: 6px; padding: 0 8px; box-sizing: border-box; cursor: pointer; }
.ec.on { background: #26324a; color: #fff; }
.ep { position: absolute; height: 46px; line-height: 46px; font-size: 17px; padding: 0 8px; box-sizing: border-box; white-space: nowrap; overflow: hidden;
  background: #1e2029; border-radius: 6px; color: #cfd3e0; cursor: pointer; }
.ep.now { background: #24304a; }
.ep.foc { background: #2f5bd3; color: #fff; }
.ep.na { color: #6b7184; background: #14151b; }
.enow { position: absolute; top: 40px; height: 530px; width: 2px; background: #e4002b; }
.ed { position: absolute; left: 20px; right: 20px; top: 578px; height: 72px; font-size: 19px; line-height: 26px; color: #cfd3e0; overflow: hidden; }
.ed b { color: #fff; }
#pvEpg { position: absolute; left: 16px; right: 16px; bottom: 14px; padding: 10px; text-align: center; font-size: 19px; font-weight: bold;
  background: #1e2029; border: 2px solid #22c55e; border-radius: 10px; cursor: pointer; display: none; }
/* renkli tuş şeridi: hangi renkli tuş ne yapar (sabit, listenin altında) */
#keys { position: absolute; left: 335px; top: 676px; width: 515px; height: 28px; padding-left: 16px; box-sizing: border-box; line-height: 28px; font-size: 16px; color: #aeb3c2;
  white-space: nowrap; overflow: hidden; }
#keys span { margin-right: 18px; cursor: pointer; }
#keys i { display: inline-block; width: 16px; height: 16px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; }
#v { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #000; }
#osd { position: absolute; left: 0; top: 0; right: 0; padding: 26px 36px 50px; background: rgba(0,0,0,0.65); display: none; }
#osdT { font-size: 36px; font-weight: bold; }
#osdE { font-size: 22px; color: #cfd3e0; margin-top: 8px; white-space: pre; }
#num { position: absolute; right: 40px; top: 30px; font-size: 72px; font-weight: bold; color: #fff; padding: 10px 30px;
  background: rgba(0,0,0,0.75); border: 3px solid #3b82f6; border-radius: 14px; display: none; z-index: 10; font-family: Arial; }
#qbox { position: absolute; left: 240px; right: 240px; top: 200px; padding: 30px; background: #16181f; border: 3px solid #3b82f6;
  border-radius: 16px; display: none; z-index: 12; text-align: center; }
#qbox p { margin: 0 0 18px; font-size: 26px; color: #9aa0b4; }
#q { width: 92%; font-size: 36px; padding: 14px 18px; background: #0d0e12; color: #fff; border: 2px solid #2a2d3a; border-radius: 10px; }
#yt { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; background: #000; display: none; }
#toast { position: absolute; left: 340px; right: 340px; top: 300px; text-align: center; font-size: 26px; padding: 18px;
  background: rgba(20,22,30,0.95); border: 2px solid #3b82f6; border-radius: 12px; display: none; z-index: 9; }
#msg { position: absolute; left: 240px; right: 240px; bottom: 80px; text-align: center; font-size: 24px; padding: 16px;
  background: rgba(0,0,0,0.75); border-radius: 10px; display: none; }
</style>
</head>
<body>
<div id="top"><div id="logo">Wolf <span>IP</span><i>TV</i></div><div id="acc">Bağlanıyor…</div><div id="clock"></div></div>
<div id="tabs"></div>
<div class="col" id="cats"></div>
<div class="col" id="items"></div><div id="sbar"><span>🔍</span><input id="sq" type="text" autocomplete="off" placeholder="Kanal, film, dizi ya da YouTube'da ara…"></div>
<div id="help">OK: oynat &nbsp;•&nbsp; P+/P− veya ▲▼: kanal &nbsp;•&nbsp; 0-9: kanal no &nbsp;•&nbsp; canlıda ◀▶: ses &nbsp;•&nbsp; Geri: geri &nbsp;•&nbsp; <b>Kırmızı</b>: favori</div>
<div id="info"></div><div id="det"><div id="dPoster"></div><div id="dBody"><div id="dTitle"></div><div id="dMeta"></div><div id="dCrew"></div><div id="dPlot"></div><div id="dBtns"></div><div id="dSeas"></div><div id="dEps"></div></div></div><div id="keys"></div><div id="epg"></div><div id="pv"><div id="pvPic"></div><div id="pvTxt"></div><div id="pvEpg">📅 TV Rehberi  (Yeşil tuş)</div></div>
<div id="toast"></div><div id="qbox"><p>Kanal, film, dizi ya da YouTube'da aranacak şeyi yaz — bitince OK / Enter</p><input id="q" type="text" autocomplete="off"></div><div id="num"></div>
<div id="player"><video id="v" autoplay></video><iframe id="yt" allow="autoplay; encrypted-media; fullscreen" allowfullscreen tabindex="-1"></iframe><div id="osd"><div id="osdT"></div><div id="osdE"></div></div><div id="msg"></div><div id="ytShield"></div><div id="pFull">⛶</div><div id="ctl"><div id="cTitle"></div><div id="cBar"><div id="cFill"></div></div><div id="cBtns"><span id="cRew">⏪ 10</span><span id="cPlay">❚❚</span><span id="cFwd">10 ⏩</span><span id="cAud">🔊 Ses</span><span id="cSub">CC Altyazı</span><span id="cTime"></span></div></div><div id="pBack">◀ Geri</div><div id="pPlay">❚❚ / ▶</div></div>

<script src="direct.js"></script>
<script>
/* Wolf IPTV - eski akıllı TV tarayıcıları için hafif ekran (ES5, kütüphanesiz) */
var ROWS = 14, CROWS = 17;
var PAGE_VER = "ios-1";
var DEROWS = 8;   /* sayfa güncellenince TV kendiliğinden yeniler */
var TABS = [["live", "Canlı TV"], ["vod", "Filmler"], ["series", "Diziler"], ["search", "🔍 Ara"]];
var CAT_ACT = { live: "get_live_categories", vod: "get_vod_categories", series: "get_series_categories" };
var ITEM_ACT = { live: "get_live_streams", vod: "get_vod_streams", series: "get_series" };
var S = { col: 1, tab: 0, cats: [], cat: 0, items: [], item: 0, mode: "list", series: null, eps: [], listItem: 0,
  now: null, favs: {}, req: 0, playing: false };
var V = document.getElementById("v");
function fitScreen() {
  var w = window.innerWidth || document.documentElement.clientWidth || 1280, h = window.innerHeight || document.documentElement.clientHeight || 720;
  var k = Math.min(w / 1280, h / 720);
  document.body.style.transform = document.body.style.webkitTransform = "scale(" + k + ")";
}
fitScreen(); window.addEventListener("resize", fitScreen, false);

function $(id) { return document.getElementById(id); }
function esc(s) { s = (s === null || s === undefined) ? "" : String(s);
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function b64(s) { try { return decodeURIComponent(escape(window.atob(s))); } catch (e) { return s || ""; } }
function kind() { return TABS[S.tab][0]; }
function idOf(k, it) { return String(k === "series" ? it.series_id : it.stream_id); }

function get(url, ok, fail) {
  var x = new XMLHttpRequest();
  x.open("GET", url, true);
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    if (x.status === 200) { var d; try { d = JSON.parse(x.responseText); } catch (e) { if (fail) fail("Hatalı yanıt"); return; } ok(d); }
    else if (fail) fail("Sunucu hatası " + x.status);
  };
  x.send(null);
}
function post(url, body, ok) {
  var x = new XMLHttpRequest();
  x.open("POST", url, true);
  x.setRequestHeader("Content-Type", "application/json");
  x.onreadystatechange = function () { if (x.readyState === 4 && x.status === 200 && ok) { try { ok(JSON.parse(x.responseText)); } catch (e) {} } };
  x.send(JSON.stringify(body));
}
function qs(o) { var a = [], k; for (k in o) if (o.hasOwnProperty(k)) a.push(encodeURIComponent(k) + "=" + encodeURIComponent(o[k])); return a.join("&"); }
function api(action, params, ok, fail) { get("/api/" + action + (params ? "?" + qs(params) : ""), ok, fail); }

/* ---------- saat / hesap ---------- */
function tick() { var d = new Date(), h = d.getHours(), m = d.getMinutes();
  $("clock").innerHTML = (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m; }
setInterval(tick, 10000); tick();
api("info", null, function (d) {
  if (!d.ok) { $("acc").innerHTML = esc(d.msg); return; }
  var e = d.exp ? new Date(d.exp * 1000) : null;
  $("acc").innerHTML = e ? "Bitiş: " + e.getDate() + "." + (e.getMonth() + 1) + "." + e.getFullYear() : esc(d.status);
});

/* ---------- çizim ---------- */
function drawTabs() {
  var h = "", i;
  for (i = 0; i < TABS.length; i++)
    h += '<div data-t="' + i + '" class="tab' + (i === S.tab ? " on" : "") + (S.col === 0 && i === S.tab ? " foc" : "") +
      '" style="left:' + (i * 182) + 'px;' + (S.col === 0 && i === S.tab ? "background:#2f5bd3;color:#fff" : "") + '">' + TABS[i][1] + "</div>";
  $("tabs").innerHTML = h;
}
function winStart(key, sel, n, R) { R = R || ROWS; var st = S[key] || 0; if (sel < st) st = sel; else if (sel >= st + R) st = sel - R + 1;
  if (st > n - R) st = n - R; if (st < 0) st = 0; S[key] = st; return st; }
function drawCats() {
  var n = S.cats.length, st = winStart("cS", S.cat, n, CROWS), h = "", i, c;
  for (i = st; i < Math.min(n, st + CROWS); i++) {
    c = S.cats[i];
    var cn = S.counts && c.category_id.charAt(0) !== "_" ? S.counts[String(c.category_id)] : null;
    h += '<div data-i="' + i + '" class="row' + (i === S.cat ? (S.col === 1 ? " foc" : " sel") : "") + (c.category_id.charAt(0) === "_" ? " head" : "") + '">' +
      (cn ? '<span class="cnt">' + cn + "</span>" : "") + esc(c.category_name) + "</div>";
  }
  $("cats").innerHTML = h || '<div class="row muted">Yükleniyor…</div>';
}
function curKey(it) {
  if (S.mode === "eps") return "ep:" + it.id;
  if (it._k) return it._k === "yt" ? "yt:" + it.id : it._k === "web" ? "web:" + it.url :
    it._k + ":" + idOf(it._k, it);
  return kind() + ":" + idOf(kind(), it);
}
/* ---------- afiş ızgarası ---------- */
var COLS = 7, GROWS = 3, TW = 122, TH = 183, GX = 10, GY = 18;
function gridMode() { var k = kind(); return S.mode === "list" && (k === "vod" || k === "series") && !S.loadingMsg; }
function poster(it) { return it.stream_icon || it.cover || (it.info && it.info.movie_image) || ""; }
function posOf(it) { var k = kind(), key = k === "series" ? (it._ep_id ? "ep:" + it._ep_id : "") : "vod:" + it.stream_id; return key && POS[key]; }
function drawGrid() {
  var list = S.items, n = list.length, row = Math.floor(S.item / COLS), st, h = "", i, it, k = kind(), x, y, img, fav, p, cls;
  st = S.gS || 0;
  if (row < st) st = row; else if (row >= st + GROWS) st = row - GROWS + 1;
  if (st < 0) st = 0; S.gS = st;
  for (i = st * COLS; i < Math.min(n, (st + GROWS) * COLS); i++) {
    it = list[i]; x = (i % COLS) * (TW + GX) + 4; y = (Math.floor(i / COLS) - st) * (TH + GY) + 6;
    img = poster(it); fav = !!S.favs[k + ":" + idOf(k, it)]; p = posOf(it);
    cls = "tile" + (i === S.item && S.col === 2 ? " foc" : "") + (S.now && S.now.key === curKey(it) ? " play" : "") + (img ? "" : " noimg");

    }
    if (kind() === "search" && S.col === 0 && (c === 40 || c === 13)) { focusSq(); drawAll(); return false; }
    var G = S.col === 2 && gridMode();
    if (c === 38) { if (S.col === 1 && S.cat === 0) { S.col = 0; drawAll(); } else if (G && S.item < COLS) { S.col = 0; drawAll(); } else if (S.col > 0) moveIn(G ? -COLS : -1); }
    else if (c === 40) { if (S.col === 0) { S.col = 1; drawAll(); } else moveIn(G ? COLS : 1); }
    else if (c === 33 || c === 427) { if (S.col > 0) moveIn(G ? -COLS * GROWS : -ROWS); }
    else if (c === 34 || c === 428) { if (S.col > 0) moveIn(G ? COLS * GROWS : ROWS); }
    else if (c === 37) {
      if (S.col === 0) loadTab((S.tab + TABS.length - 1) % TABS.length);
      else if (G && S.item % COLS > 0) moveIn(-1);
      else if (S.col === 2) { S.col = 1; drawAll(); }
    }
    else if (c === 39) {
      if (S.col === 0) loadTab((S.tab + 1) % TABS.length);
      else if (S.col === 1) { if (S.cat !== S.loadedCat) loadCat(); S.col = 2; drawAll(); }
      else if (G) moveIn(1);
    }
    else if (c === 13) { if (S.col === 0) { S.col = 1; drawAll(); } else ok(); }
    else if (c === 403 || c === 82) toggleFav();
    else if (c === 8 || c === 27 || c === 461 || c === 10009 || c === 166) backKey();
    else handled = false;
  }
  if (handled) { if (e.preventDefault) e.preventDefault(); e.returnValue = false; return false; }
  return true;
};

/* ---------- geri tuşu: sayfadan / tarayıcıdan ÇIKMASIN ----------
   Sayfanın üstünde hep bir "bekçi" geçmiş kaydı tutulur. Geri tuşu (tarayıcı kendisi geri gitse de gitmese de)
   tek bir popstate üretir; biz onu yakalayıp uygulama içinde bir adım geri gideriz ve bekçiyi yeniden koyarız. */
var backT = null, readyAt = new Date().getTime() + 800;
var backAt = 0;
function backKey() {
  var now = new Date().getTime();
  if (now - backAt < 250) return;   /* aynı basışın tekrarı */
  backAt = now; back();
}
window.addEventListener("popstate", function () {
  try { history.pushState({ w: 1 }, ""); } catch (e) {}
  var now = new Date().getTime();
  if (now < readyAt || now - backAt < 800) return;   // tuş zaten işlendi / açılıştaki boş olay
  backAt = now; back();
}, false);
try { history.replaceState({ w: 0 }, ""); history.pushState({ w: 1 }, ""); } catch (e) {}

/* ---------- tam ekran: tarayıcının adres çubuğunu gizle (ilk tuş/tıklamada) ---------- */
function goFull() {
  var d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen || d.webkitRequestFullScreen;
  if (!f || document.fullscreenElement || document.webkitFullscreenElement || document.webkitIsFullScreen) return;
  try { var p = f.call(d); if (p && p["catch"]) p["catch"](function () {}); } catch (e) {}
}

/* ---------- sihirli kumanda (imleç): üzerine gel = seç, tıkla = aç ---------- */
S.pointer = false;
var pshowT = null;
function setCls() { document.body.className = (S.pointer ? "ptr" : "") + (S.pshow ? " pshow" : ""); }
function setPtr(on) {
  if (S.pointer === on) return; S.pointer = on;
  if (!on) S.pshow = false;
  setCls();
}
/* Geri / Oynat düğmeleri: imleç kıpırdayınca 4 sn görünür, sonra kendiliğinden gizlenir */
function showBtns() {
  clearTimeout(pshowT);
  if (!S.pshow) { S.pshow = true; setCls(); }
  pshowT = setTimeout(function () { S.pshow = false; setCls(); }, 4000);
}
document.addEventListener("keydown", function () { if (S.pshow) { clearTimeout(pshowT); S.pshow = false; setCls(); } }, true);
var hoverOK = true, lastMX = -1, lastMY = -1;
document.addEventListener("mousemove", function (e) {
  var x = e.clientX, y = e.clientY;
  if (lastMX < 0 || Math.abs(x - lastMX) + Math.abs(y - lastMY) > 12) { hoverOK = true; lastMX = x; lastMY = y; }
  else return;   /* liste altında kayınca oluşan sahte hareket: yok say */
  setPtr(true); showBtns(); if (ctlOn()) ctlShow();
}, false);
document.addEventListener("keydown", function () { hoverOK = false; }, true);
document.addEventListener("wheel", function () { hoverOK = false; }, true);
document.addEventListener("mousewheel", function () { hoverOK = false; }, true);
document.addEventListener("cursorStateChange", function (e) { setPtr(!!(e.detail && e.detail.visibility)); }, false);
function hit(e) {
  var t = e.target || e.srcElement, a;
  while (t && t !== document.body && t.getAttribute) {
    a = t.getAttribute("data-i"); if (a !== null) return { i: parseInt(a, 10), box: t.parentNode.id, star: (e.target.className || "").indexOf("s") === 0 };
    a = t.getAttribute("data-t"); if (a !== null) return { t: parseInt(a, 10) };
    t = t.parentNode;
  }
  return null;
}
document.addEventListener("mouseover", function (e) {
  if (!hoverOK || S.epg) return;   /* tekerlek / ok tuşuyla gezinirken imleç seçimi değiştirmesin */
  if (S.det && !S.playing) {   /* detay sayfası: imleç üzerine gelince seçili olsun */
    var el = e.target || e.srcElement, a, D = S.det;
    while (el && el !== document.body && el.getAttribute) {
      if ((a = el.getAttribute("data-b")) !== null) { if (D.zone !== 0 || D.btn !== +a) { D.zone = 0; D.btn = +a; detDraw(); } return; }
      if ((a = el.getAttribute("data-s")) !== null) { if (D.zone !== 1) { D.zone = 1; detDraw(); } return; }
      if ((a = el.getAttribute("data-e")) !== null) { if (D.zone !== 2 || D.e !== +a) { D.zone = 2; D.e = +a; detDraw(); } return; }
      el = el.parentNode;
    }
    return;
  }
  if (S.playing || S.det) return;
  var r = hit(e); if (!r || r.t !== undefined) return;
  if (r.box === "cats") { if (S.col === 1 && S.cat === r.i) return; S.col = 1; S.cat = r.i; drawAll(); }
  else if (r.box === "items") { if (S.col === 2 && S.item === r.i) return; S.col = 2; S.item = r.i; drawAll(); }
}, false);
document.addEventListener("click", function (e) {
  goFull(); setPtr(true); showBtns();
  var t = e.target || e.srcElement;
  if (S.mini && (t.id === "v" || t.id === "player" || t.id === "pFull")) { goFullPlayer(); return; }
  if (S.det || S.epg) {   /* detay sayfası / rehber açıkken sekmeye tıklayınca o sekmeye geç */
    var te = t; while (te && te !== document.body && te.getAttribute) { if (te.getAttribute("data-t") !== null) break; te = te.parentNode; }
    if (te && te.getAttribute && te.getAttribute("data-t") !== null) {
      if (S.det) closeDet(); if (S.epg) closeEpg();
      loadTab(+te.getAttribute("data-t")); S.col = 1; if (kind() === "search") focusSq(); drawAll(); return;
    }
  }
  if (t.id === "pvEpg") { openEpg(); return; }
  var kc = t.getAttribute ? t.getAttribute("data-k") : null; if (kc === null && t.parentNode && t.parentNode.getAttribute) kc = t.parentNode.getAttribute("data-k");
  if (kc) { if (kc === "del") delKey(false); else if (kc === "clr") delKey(true); else if (kc === "epg") openEpg(); else if (kc === "fav") toggleFav(); return; }
  if (S.epg && !S.playing) {
    var ea, eel = t, E = S.epg;
    while (eel && eel !== document.body && eel.getAttribute) {
      if ((ea = eel.getAttribute("data-ec")) !== null) { if (E.sel === +ea) { epgKey(13); } else { E.sel = +ea; E.pi = -1; epgDraw(); } return; }
      if ((ea = eel.getAttribute("data-er")) !== null) { var pj = +eel.getAttribute("data-ep");
        if (E.sel === +ea && E.pi === pj) { epgKey(13); } else { E.sel = +ea; E.pi = pj; var PP = E.data[E.list[E.sel].stream_id]; if (PP && PP[pj]) E.ft = Math.max(PP[pj].s, E.t0); epgDraw(); } return; }
      eel = eel.parentNode;
    }
    return;
  }
  if (S.det && !S.playing) {
    var a, el = t;
    while (el && el !== document.body && el.getAttribute) {
      if ((a = el.getAttribute("data-b")) !== null) { S.det.zone = 0; S.det.btn = +a; detAct(S.det.btns[+a][1]); return; }
      if ((a = el.getAttribute("data-s")) !== null) { S.det.zone = 1; S.det.s = +a; S.det.e = 0; S.det.eS = 0; detDraw(); return; }
      if ((a = el.getAttribute("data-e")) !== null) { S.det.zone = 2; S.det.e = +a; detPlayEp(+a); return; }
      el = el.parentNode;
    }
    return;
  }
  if (S.playing) {
    if (t.id === "pBack") { back(); return; }
    if (!S.now) return;
    if (t.id === "cRew") { seekBy(-10); return; }
    if (t.id === "cFwd") { seekBy(10); return; }
    if (t.id === "cPlay") { togglePause(); return; }
    if (t.id === "cAud") { cycleAudio(); return; }
    if (t.id === "cSub") { cycleSub(); return; }
    if (t.id === "cBar" || t.id === "cFill") { seekTo(e); return; }
    if (!S.now.live) { if ($("ctl").style.display === "block") togglePause(); else ctlShow(); }
    else osd(S.now.title, $("osdE").innerHTML);
    return;
  }
  if (t.getAttribute && t.getAttribute("data-del") !== null) { S.item = +t.getAttribute("data-del"); delKey(false); return; }
  var r = hit(e); if (!r) return;
  if (r.t !== undefined) { loadTab(r.t); S.col = 1; if (kind() === "search") focusSq(); drawAll(); return; }
  if (r.box === "cats") { S.cat = r.i; S.col = 1; loadCat(); return; }
  if (r.box === "items") {
    S.col = 2; S.item = r.i;
    if (r.star && S.mode === "list") { toggleFav(); return; }
    ok();
  }
}, false);
function wheel(e) {
  if (S.playing) return;
  var d = (e.deltaY || -(e.wheelDelta || 0)) > 0 ? 1 : -1, t = e.target, inCats = false;
  while (t && t !== document.body) { if (t.id === "cats") { inCats = true; break; } if (t.id === "items") break; t = t.parentNode; }
  S.col = inCats ? 1 : 2; moveIn(d * (!inCats && gridMode() ? COLS : 2)); drawAll();
  if (e.preventDefault) e.preventDefault();
}
if ("onwheel" in document) document.addEventListener("wheel", wheel, false); else document.addEventListener("mousewheel", wheel, false);

loadTab(0);
</script>
