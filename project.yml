name: WolfIPTV
options:
  bundleIdPrefix: com.wolf
  deploymentTarget: { iOS: "15.0" }
targets:
  WolfIPTV:
    type: application
    platform: iOS
    sources:
      - path: WolfIPTV/App.swift
      - path: WolfIPTV/www
        type: folder
        buildPhase: resources
    info:
      path: WolfIPTV/Info.plist
      properties:
        CFBundleDisplayName: Wolf IPTV
        CFBundleShortVersionString: "1.7"
        CFBundleVersion: "8"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        NSAppTransportSecurity: { NSAllowsArbitraryLoads: true, NSAllowsArbitraryLoadsInWebContent: true }
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.wolf.iptv
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
