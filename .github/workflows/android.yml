name: Android APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      - name: Sayfaları iPhone sürümünden kopyala
        run: mkdir -p android/app/src/main/assets && cp -R WolfIPTV/www android/app/src/main/assets/www
      - name: APK derle
        run: cd android && gradle assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk WolfIPTV.apk
      - uses: actions/upload-artifact@v4
        with: { name: WolfIPTV-apk, path: WolfIPTV.apk }
      - uses: softprops/action-gh-release@v2
        with: { tag_name: "android-latest", name: "Wolf IPTV Android", files: WolfIPTV.apk }
