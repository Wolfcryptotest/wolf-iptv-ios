name: iOS IPA
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - run: |
          xcodebuild -project WolfIPTV.xcodeproj -scheme WolfIPTV -configuration Release \
            -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/WolfIPTV.app Payload/
          zip -qr WolfIPTV.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: WolfIPTV-ipa, path: WolfIPTV.ipa }
      - uses: softprops/action-gh-release@v2
        with: { tag_name: "ios-latest", files: WolfIPTV.ipa }
